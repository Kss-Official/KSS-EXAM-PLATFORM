version: "3.9"

# Round 2 Coding Execution Stack (Separate from DB/API host in production)
# Requires Linux host with cgroup v1 enabled for Judge0 CE v1.13.1 isolate sandbox.

networks:
  edge_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true  # No outbound internet or DB network access from sandbox

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - edge_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_local_pass}
      POSTGRES_DB: judge0
    networks:
      - sandbox_net

  judge0-redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - sandbox_net

  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_local_pass}
      POSTGRES_DB: judge0
    networks:
      - edge_net
      - sandbox_net

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_local_pass}
      POSTGRES_DB: judge0
    networks:
      - sandbox_net  # Isolated: no internet, no app DB access

  coding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "arq", "worker.coding_worker.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      CODING_ROUND_ENABLED: "true"
      CODING_SANDBOX_DRIVER: "judge0"
      REDIS_URL: "redis://redis:6379/0"
      JUDGE0_URL: "http://judge0-server:2358"
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - edge_net
