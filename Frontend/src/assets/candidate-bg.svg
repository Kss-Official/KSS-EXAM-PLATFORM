<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Talentise Global Candidate Portal Geometric Facets Theme -->
  <defs>
    <linearGradient id="talentiseMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFF7ED" />
    </linearGradient>
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="orangeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.35" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#talentiseMesh)" />

  <polygon points="0,0 880,0 540,360 0,240" fill="#F1F5F9" opacity="0.7" />
  <polygon points="880,0 1520,0 1180,390 540,360" fill="url(#blueFacet)" />
  <polygon points="1520,0 1920,0 1920,480 1180,390" fill="#F8FAFC" />
  <polygon points="1180,390 1920,480 1920,860 1460,680" fill="url(#orangeFacet)" />
  <polygon points="540,360 1180,390 1460,680 820,600" fill="#EEF2FF" opacity="0.75" />
  <polygon points="0,240 540,360 820,600 380,740 0,640" fill="#FFFFFF" opacity="0.85" />
  <polygon points="820,600 1460,680 1650,1080 720,1080 380,740" fill="url(#blueFacet)" opacity="0.55" />
  <polygon points="0,640 380,740 720,1080 0,1080" fill="#F1F5F9" opacity="0.8" />
  <polygon points="1460,680 1920,860 1920,1080 1650,1080" fill="url(#orangeFacet)" opacity="0.65" />

  <!-- Subtle accent orbs -->
  <circle cx="1820" cy="160" r="340" fill="#FFEDD5" opacity="0.3" />
  <circle cx="100" cy="940" r="300" fill="#DBEAFE" opacity="0.4" />
</svg>
