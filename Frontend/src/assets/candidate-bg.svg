<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Talentise Global Warm Radiant Facets Theme -->
  <defs>
    <linearGradient id="tgBaseMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Warm Radiant Amber Facet -->
    <linearGradient id="warmSunsetFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.15" />
    </linearGradient>

    <!-- Royal Navy & Electric Blue Facet -->
    <linearGradient id="royalBlueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.10" />
    </linearGradient>

    <!-- Radiant Sunset Coral Glow -->
    <radialGradient id="sunGlow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#FB9F0C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0" />
    </radialGradient>

    <!-- Royal Navy Deep Glow -->
    <radialGradient id="navyGlow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#tgBaseMesh)" />
  <rect width="1920" height="1080" fill="url(#sunGlow)" />
  <rect width="1920" height="1080" fill="url(#navyGlow)" />

  <!-- Clean modern geometric polygon facets -->
  <polygon points="0,0 880,0 540,360 0,240" fill="#FFFFFF" opacity="0.75" />
  <polygon points="880,0 1520,0 1180,390 540,360" fill="url(#warmSunsetFacet)" />
  <polygon points="1520,0 1920,0 1920,480 1180,390" fill="#FFFFFF" opacity="0.80" />
  <polygon points="1180,390 1920,480 1920,860 1460,680" fill="url(#royalBlueFacet)" />
  <polygon points="540,360 1180,390 1460,680 820,600" fill="#FFFBF5" opacity="0.65" />
  <polygon points="0,240 540,360 820,600 380,740 0,640" fill="#FFFFFF" opacity="0.90" />
  <polygon points="820,600 1460,680 1650,1080 720,1080 380,740" fill="url(#warmSunsetFacet)" />
  <polygon points="0,640 380,740 720,1080 0,1080" fill="#F8FAFC" opacity="0.85" />
  <polygon points="1460,680 1920,860 1920,1080 1650,1080" fill="url(#royalBlueFacet)" />
</svg>
