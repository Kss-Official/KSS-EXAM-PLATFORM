pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.facebook.react.settings") {
                useModule("com.facebook.react:settings-plugin:0.88.1")
            }
        }
    }
    includeBuild(new File(rootDir, "../node_modules/@react-native/gradle-plugin"))
}
plugins {
    id("com.facebook.react.settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["npx", "--yes", "@react-native-community/cli", "config"])
}

rootProject.name = 'examsecure'
include ':app'
