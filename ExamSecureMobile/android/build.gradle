// Project-level build.gradle — ExamSecure React Native Android
// Compatible with React Native 0.88.1 / Expo SDK 58
buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            force "com.facebook.react:react-android:0.88.1"
            force "androidx.core:core:1.15.0"
            force "androidx.core:core-ktx:1.15.0"
            dependencySubstitution {
                substitute module("com.facebook.react:react-native") using module("com.facebook.react:react-android:0.88.1") because "React Native 0.71+ publishes under react-android"
                substitute module("com.facebook.react:hermes-android") using module("com.facebook.react:react-android:0.88.1") because "Hermes is bundled into react-android in RN 0.88"
            }
        }
    }
}

subprojects { subproject ->
    afterEvaluate {
        if (subproject.name == 'react-native-async-storage_async-storage') {
            subproject.dependencies {
                implementation "androidx.room:room-runtime:2.6.1"
                implementation "androidx.room:room-ktx:2.6.1"
            }
        }
    }
}
