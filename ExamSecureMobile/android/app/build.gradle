// AGP 9+ has built-in Kotlin support — do NOT apply org.jetbrains.kotlin.android
apply plugin: 'com.android.application'

android {
    namespace "in.kalpanaaasoftwaresolutions.examsecure"
    compileSdk = 36

    defaultConfig {
        applicationId "in.kalpanaaasoftwaresolutions.examsecure"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false")
        buildConfigField("boolean", "IS_HERMES_ENABLED", "true")

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        release {
            assets.srcDirs += ["build/generated/assets/react/release"]
            res.srcDirs += ["build/generated/res/react/release"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    aaptOptions {
        noCompress "tflite"
    }
}

def bundleAssetsDir = file("$buildDir/generated/assets/react/release")
def bundleResDir = file("$buildDir/generated/res/react/release")

tasks.register("bundleReleaseJsAndAssets", Exec) {
    workingDir = file("../..")
    doFirst {
        bundleAssetsDir.mkdirs()
        bundleResDir.mkdirs()
    }
    commandLine(
        "node",
        "./node_modules/expo/bin/cli",
        "export:embed",
        "--platform", "android",
        "--dev", "false",
        "--entry-file", "./node_modules/expo-router/entry.js",
        "--bundle-output", "${bundleAssetsDir}/index.android.bundle",
        "--assets-dest", "${bundleResDir}"
    )
}

tasks.whenTaskAdded { task ->
    if (task.name == "mergeReleaseAssets" || task.name == "mergeReleaseResources" || task.name == "generateReleaseResources") {
        task.dependsOn("bundleReleaseJsAndAssets")
    }
}

dependencies {
    // React Native core & Hermes (RN 0.88.1)
    implementation("com.facebook.react:react-android:0.88.1")
    implementation("com.facebook.hermes:hermes-android:260318099.0.5")

    // Manually linked subprojects
    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-worklets')

    // Android core
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google ML Kit
    implementation "com.google.mlkit:face-detection:16.1.7"

    // TensorFlow Lite
    implementation "org.tensorflow:tensorflow-lite:2.16.1"

    // Kotlin coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
