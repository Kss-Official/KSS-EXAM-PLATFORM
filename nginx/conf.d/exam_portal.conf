# ==============================================================================
# ExamSecure Virtual Host Configuration
# Load Balanced Reverse Proxy, SSL Termination & Static Caching
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost examportal.internal examsecure.local;

    # Root directory for production React SPA bundle
    # Linux Standard: /var/www/exam-portal/Frontend/dist (or /usr/share/nginx/html)
    # Windows Dev Override: "C:/Users/HP/Desktop/Akash/Exam Portal/Frontend/dist";
    root /var/www/exam-portal/Frontend/dist;
    index index.html;

    # Maximum file upload size for exam documents and candidate identity photos
    client_max_body_size 35m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Frontend SPA HTML Entry Point (Zero Caching for Fresh Assets)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # Immutable Static Assets (Vite Hashed JS/CSS/Fonts/Images)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # API Reverse Proxy & Load Balancing (/api/*)
    # --------------------------------------------------------------------------
    location /api/ {
        # High-capacity burst queue accommodating 800 candidates without dropping answers
        limit_req zone=exam_api_zone burst=800 nodelay;
        limit_conn exam_conn_zone 1024;

        proxy_pass http://exam_backend_cluster;
        proxy_http_version 1.1;

        # Keepalive headers to reuse sockets to FastAPI workers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # High-concurrency proxy memory buffers (prevents disk buffering bottleneck)
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;

        # Timeouts for database transactions and batch submission evaluation
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable caching for dynamic examination endpoints
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --------------------------------------------------------------------------
    # Real-time WebSocket & SSE Telemetry (Proctor Feeds & Live Admin Sync)
    # --------------------------------------------------------------------------
    location ~* ^/api/(ws|events|proctor/feed|proctor/stream) {
        proxy_pass http://exam_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived persistent connection for live proctoring stream
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Health Check Endpoint for Load Balancers & Upstream Monitoring
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://exam_backend_cluster/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
