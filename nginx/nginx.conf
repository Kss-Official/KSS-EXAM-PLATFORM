# ==============================================================================
# ExamSecure Enterprise Platform - High-Concurrency Nginx Architecture
# Optimized for 800+ Simultaneous Exam Candidates, Low Latency & Zero Dropped Frames
# ==============================================================================

# Automatically scale worker processes to match system CPU cores
worker_processes auto;

# Maximum number of open file descriptors per worker process
worker_rlimit_nofile 65535;

events {
    # Number of simultaneous connections each worker process can maintain
    worker_connections 4096;
    # Accept multiple connections per event iteration to handle concurrent candidate bursts
    multi_accept on;
}

http {
    # --------------------------------------------------------------------------
    # MIME Types and Basic Optimizations
    # --------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;

    # Zero-copy kernel sendfile optimization for static content
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Keepalive timeout between client and Nginx
    keepalive_timeout   65s;
    keepalive_requests  10000;

    # Hide server software version in headers for enterprise security
    server_tokens off;

    # --------------------------------------------------------------------------
    # Client Request & Buffer Tuning
    # --------------------------------------------------------------------------
    client_max_body_size        35m;   # Supports high-res webcam snapshots & file uploads
    client_body_buffer_size     256k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # Gzip Dynamic Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Rate Limiting & Concurrency Zones
    # Designed specifically for 800 simultaneous candidates:
    # 800 candidates autosaving every few seconds generates ~160-250 requests/sec.
    # The zone allows high throughput with smooth burst capacity so no candidate drops.
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=exam_api_zone:20m rate=500r/s;
    limit_conn_zone $binary_remote_addr zone=exam_conn_zone:20m;

    # --------------------------------------------------------------------------
    # Upstream Backend Cluster (Load Balancing with Least Connections)
    # --------------------------------------------------------------------------
    upstream exam_backend_cluster {
        # least_conn distributes load to the worker with the lowest active connections
        least_conn;

        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s weight=1;

        # Keepalive maintains persistent HTTP/1.1 connections to backend workers
        keepalive 128;
    }

    # --------------------------------------------------------------------------
    # Include Modular Server Configurations
    # --------------------------------------------------------------------------
    include conf.d/*.conf;
}
