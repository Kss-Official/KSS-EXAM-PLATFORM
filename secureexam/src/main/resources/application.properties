spring.datasource.password=YKzUSq*/&q6wHvm
spring.datasource.driver-class-name=org.postgresql.Driver

# Development database settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.baseline-on-migrate=true

# Initial Administrator Provisioning Bootstrap
# Only this explicitly provisioned account receives SUPER_ADMIN
app.security.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.security.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:d.koushik@kalpanaaasoftwaresolutions.in}
app.security.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@ExamSecure2026!}
app.security.bootstrap.full-name=${ADMIN_BOOTSTRAP_FULLNAME:D. Koushik}

# Session Management & Secure Cookie Configuration
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Rate Limiter Settings
app.security.rate-limit.max-attempts=5
app.security.rate-limit.lockout-minutes=15

# Confidential Document Storage & In-Memory Multipart Threshold
app.storage.upload-dir=./private-storage/documents
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=25MB